<div class="body">
  <main-header backLink="/generate-recipe" backLinkName="Ingredients"></main-header>
  <main class="preferences">
    <h1 class="form__title">Choose your preferences</h1>
    <form class="form" (submit)="onSubmit($event)">
      <article class="form__portions">
        <fieldset class="form__fieldset fieldset">
          <legend class="legend">How many portions you need?</legend>
          <app-stepper class="form__stepper" [(value)]="preferencesService.portions" [min]="1" [max]="12" label="Portions" />
        </fieldset>

        <fieldset class="form__fieldset fieldset">
          <legend class="legend legend--margin">How many are cooking?</legend>
          <app-stepper class="form__stepper" [(value)]="preferencesService.persons" [min]="1" [max]="4" label="Person" />
        </fieldset>
      </article>

      <article class="greenbg form__preferences">
        <fieldset class="form__fieldset fieldset">
          <div class="legend-container">
            <img src="/assets/icons/schedule.png" alt="" class="legend--icon" />
            <legend class="legend legend--margin">Cooking time</legend>
          </div>
          <section class="chip-group">
            @for (opt of cookingTimeOptions; track opt.value) {
              <app-chip
                [label]="opt.label"
                [caption]="opt.caption"
                [checked]="preferencesService.cooking_time().includes(opt.value)"
                (toggled)="toggleSelection(preferencesService.cooking_time, opt.value)"
              />
            }
          </section>
        </fieldset>

        <fieldset class="form__fieldset fieldset">
          <div class="legend-container">
            <img src="/assets/icons/public.png" alt="" class="legend--icon" />
            <legend class="legend">Cuisine</legend>
          </div>
          <section class="chip-group">
            @for (opt of cuisineOptions; track opt.value) {
              <app-chip
                [label]="opt.label"
                [checked]="preferencesService.cuisine().includes(opt.value)"
                (toggled)="toggleSelection(preferencesService.cuisine, opt.value)"
              />
            }
          </section>
        </fieldset>

        <fieldset class="form__fieldset fieldset">
          <div class="legend-container">
            <img src="/assets/icons/fork_spoon.png" alt="" class="legend--icon" />
            <legend class="legend">Diet preferences</legend>
          </div>
          <section class="chip-group">
            @for (opt of dietOptions; track opt.value) {
              <app-chip
                [label]="opt.label"
                [checked]="preferencesService.diet().includes(opt.value)"
                (toggled)="toggleSelection(preferencesService.diet, opt.value)"
              />
            }
          </section>
        </fieldset>
      </article>
      <app-button className="btn__primary" class="form__submit" theme="green" btnType="submit">Generate recipe</app-button>
    </form>
  </main>
</div>
