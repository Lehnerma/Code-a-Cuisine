<article class="body grid-2col">
  <div class="body__content">
    <main-header [theme]="'creme'" [isHidden]="true"></main-header>
    <main class="main">
      <article class="title">
        <h1 class="title--first">Code à Cuisine</h1>
        <h2 class="title--second">AI-Powerd recipe generator</h2>
      </article>
      <app-button className="btn__primary" [theme]="'creme'">Get started</app-button>
    </main>
    <footer class="footer">
      <p class="footer__description">Hungry for inspiration?</p>
      <app-button className="btn__secondary" [theme]="'creme'"
        >Go to cookbook
        <svg
          class="btn__secondary--icon"
          viewBox="0 0 26 15"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M1 6.36395C0.447715 6.36395 0 6.81167 0 7.36395C0 7.91624 0.447715 8.36395 1 8.36395V6.36395ZM25.7071 8.07106C26.0976 7.68054 26.0976 7.04737 25.7071 6.65685L19.3431 0.292885C18.9526 -0.0976396 18.3195 -0.0976396 17.9289 0.292885C17.5384 0.683409 17.5384 1.31657 17.9289 1.7071L23.5858 7.36395L17.9289 13.0208C17.5384 13.4113 17.5384 14.0445 17.9289 14.435C18.3195 14.8255 18.9526 14.8255 19.3431 14.435L25.7071 8.07106ZM1 7.36395V8.36395H25V7.36395V6.36395H1V7.36395Z"
          /></svg
      ></app-button>
    </footer>
  </div>

  <div class="dishes">
    <img src="/assets/img/dishes-col.png" alt="dishes" class="dishes__img" />
  </div>
</article>
