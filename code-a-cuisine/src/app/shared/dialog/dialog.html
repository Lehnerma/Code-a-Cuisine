<dialog #dialog class="dialog" (cancel)="goBack($event)">
  <button type="button" class="dialog__close" aria-label="Close dialog" (click)="goBack()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <section class="dialog__container">
    <h1 class="dialog__title">{{ title() }}</h1>
    <p class="dialog__msg">{{ message() }}</p>

    <app-button tag="a" [targetRoute]="actionRoute()" className="btn__secondary" theme="creme" class="dialog__backBtn"
      >Go back to ingredients
      <svg class="btn__secondary--icon" width="26" height="15" viewBox="0 0 26 15" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M1 6.36401C0.447715 6.36401 0 6.81173 0 7.36401C0 7.9163 0.447715 8.36401 1 8.36401V6.36401ZM25.7071 8.07112C26.0976 7.6806 26.0976 7.04743 25.7071 6.65691L19.3431 0.292946C18.9526 -0.0975785 18.3195 -0.0975785 17.9289 0.292946C17.5384 0.68347 17.5384 1.31664 17.9289 1.70716L23.5858 7.36401L17.9289 13.0209C17.5384 13.4114 17.5384 14.0446 17.9289 14.4351C18.3195 14.8256 18.9526 14.8256 19.3431 14.4351L25.7071 8.07112ZM1 7.36401V8.36401H25V7.36401V6.36401H1V7.36401Z"
          fill="#FAF0E6"
        />
      </svg>
    </app-button>
  </section>
</dialog>
