<span class="chip">
  <input [id]="inputId" [checked]="checked()" (change)="toggled.emit()" class="chip__input" type="checkbox" />
  <label [for]="inputId" class="chip__label text-md">{{ label() }}</label>
  @if (caption()) {
    <span class="chip__caption text-sm">{{ caption() }}</span>
  }
</span>
